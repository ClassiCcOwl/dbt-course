name: airbnb
profile: airbnb
version: 1.0.0
model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots
asset-paths:
  - assets
clean-targets:
  - target
  - dbt_packages
on-run-start:
  - CREATE TABLE IF NOT EXISTS {{ target.schema }}.audit_log ( model_name STRING, run_timestamp TIMESTAMP)
models:
  airbnb:
    +grants:
      select:
        - transform
        - reporter
    +post-hook:
      - INSERT INTO {{ target.schema }}.audit_log VALUES ('{{ this }}', CURRENT_TIMESTAMP)
    +materialized: view
    dim:
      +materialized: table
    src:
      +materialized: ephemeral
data_tests:
  +store_failures: true
  +schema: _test_failures
vars:
  user_name: user_name_default_for_this_project
flags:
  require_generic_test_arguments_property: true

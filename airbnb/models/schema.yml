models:
  - name: dim_listings_cleansed
    description: Cleansed table which cointains Airbnb listings
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
    columns:
      - name: listing_id
        description: "The unique identifier for each listing."
        data_tests:
          - not_null
          - unique

      - name: host_id
        description: "The unique identifier for the host of the listing."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed', v = 2)
                field: host_id

      - name: room_type
        description: "The type of room for the listing."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "Entire home/apt",
                    "Private room",
                    "Shared room",
                    "Hotel room",
                  ]
      - name: minimum_nights
        description: '{{ doc("dim_listings_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: "2026-09-11"
      - v: 2
        defined_in: dim_hosts_cleansed_v2
        columns:
          - include: "*"
            exclude: [host_name]
          - name: host_name
            description: "The name of the host."
            data_type: string
            constraints:
              - type: not_null
    latest_version: 2
    description: Cleansed table which contains Airbnb hosts
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "The unique identifier for each host."
        constraints:
          - type: not_null
        data_type: integer

      - name: host_name
        description: "The name of the host."
        data_type: string
        constraints:
          - type: not_null

      - name: is_superhost
        description: "Indicates whether the host is a superhost."
        data_type: string

      - name: updated_at
        description: "The timestamp when the host information was last updated."
        data_type: timestamp

      - name: created_at
        description: "The timestamp when the host information was created."
        data_type: timestamp

  - name: dim_listings_w_hosts
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        description: "The price of the listing."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.99
                min_value: 50
                max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000

              config:
                severity: warn

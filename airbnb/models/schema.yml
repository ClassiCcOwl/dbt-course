models:
  - name: dim_listings_cleansed
    description: Cleansed table which cointains Airbnb listings
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
    columns:
      - name: listing_id
        description: "The unique identifier for each listing."
        data_tests:
          - not_null
          - unique

      - name: host_id
        description: "The unique identifier for the host of the listing."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: "The type of room for the listing."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "Entire home/apt",
                    "Private room",
                    "Shared room",
                    "Hotel room",
                  ]
      - name: minimum_nights
        description: "The minimum number of nights required to book the listing."
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "The unique identifier for each host."
        constraints:
          - type: not_null
        data_type: integer

      - name: host_name
        description: "The name of the host."
        data_type: string
        constraints:
          - type: not_null

      - name: is_superhost
        description: "Indicates whether the host is a superhost."
        data_type: string

      - name: updated_at
        description: "The timestamp when the host information was last updated."
        data_type: timestamp

      - name: created_at
        description: "The timestamp when the host information was created."
        data_type: timestamp
